<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BetCamp</title>
</head>

<body>
    <main>
        <h1>BBK BetCamp</h1>

        <section id="inicio-juego">
            <p>Saldo:
                <span id="saldo-dinero">0</span>
                €
            </p>
            <button type="button" id="boton-jugar">Jugar</button>
        </section>

        <section id="info-juego">

            <div id="cabecera-juego">
                <h2 id="titulo-juego">JUEGO: Pleno de 5</h2>
                <p>Este juego se trata de adivinar y pasar por las diferentes rondas. Bla bla bla.</p>
            </div>

            <div id="info-ronda">
                <h3 id="nombre-ronda">Nombre ronda</h3>
                <p id="numero-rondas"></p>
                <p id="descripcion-ronda"></p>
            </div>

        </section>





        <section id="mesa-juego">

            <div id="pila-baraja">
                <p>Todavía no hay una baraja</p>
            </div>

            <div id="carta-mesa">
                <p>Todavía no hay carta en la mesa</p>
            </div>

            <div id="carta-mano">
                <p>Todavía no tienes cartas en la mano</p>
            </div>

        </section>


        <section id="decisiones">

            <div id="opciones-ronda">
                <button type="button" id="boton-opcion1" disabled>Mayor</button>
                <button type="button" id="boton-opcion2" disabled>Menor</button>
            </div>

            <p id="resultado-ronda">Sin resultado</p>

        </section>

    </main>

    <script type="module" src="js/main.js"></script>
</body>

</html>
