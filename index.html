<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BetCamp</title>
</head>

<body>
    <main>
        <h1>BBK BetCamp</h1>

        <section id="inicio-juego">
            <p>Saldo:
                <span id="saldo-dinero">0</span> €
            </p>
            <button type="button" id="boton-jugar">Jugar</button>
        </section>

        <section id="info-juego">
            <h2 id="titulo-juego">Blackjack</h2>
            <p>Acércate a 21 sin pasarte y supera la puntuación de la banca.</p>
        </section>

        <section id="mesa-juego">
            <h2>Mesa de juego</h2>

            <!-- ZONA BANCA
             ________________________ -->

            <div id="zona-banca">
                <h3>Banca</h3>
                <p>
                    Puntos:
                    <span id="puntos-banca">0</span>
                </p>
                <div id="cartas-banca">
                    <p>Esperando el reparto...</p>
                </div>
            </div>

            <!-- PILA BARAJA
             ________________________ -->

            <div id="pila-baraja">
                <p>Todavía no hay una baraja</p>
            </div>

            <!-- ZONA JUGADOR
             ________________________ -->

            <div id="zona-jugador">
                <h3>Tu mano</h3>
                <p>
                    Puntos:
                    <span id="puntos-jugador">0</span>
                </p>
                <div id="cartas-jugador">
                    <p>Esperando el reparto...</p>
                </div>
            </div>
        </section>

        <section id="acciones-juego">
            <h2>Tu turno</h2>

            <p id="mensaje-juego">Pulsa «Jugar» para empezar.</p>

            <div>
                <button type="button" id="boton-pedir" disabled>
                    Pedir carta
                </button>

                <button type="button" id="boton-plantarse" disabled>
                    Plantarse
                </button>
            </div>

            <p id="resultado-partida"></p>
        </section>

    </main>

    <script type="module" src="js/main.js"></script>
</body>

</html>
